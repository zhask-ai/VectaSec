# Golden fixture: a realistic, insecure-by-omission Mosquitto broker.
# Anonymous access is explicitly on, there is no password_file and no acl_file,
# two plaintext listeners are exposed on all interfaces, and a bridge replicates
# to a cloud broker with neither TLS nor credentials.

allow_anonymous true

# Default MQTT — plaintext, all interfaces
listener 1883 0.0.0.0
protocol mqtt

# WebSockets — also plaintext
listener 9001 0.0.0.0
protocol websockets

# A TLS listener DOES exist (so the broker-level "no TLS listener at all" rule must NOT fire)
listener 8883 0.0.0.0
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
cafile /etc/mosquitto/certs/ca.crt
require_certificate false

# Bridge out to a public cloud broker — plaintext, anonymous
connection cloud-bridge
address broker.example-cloud.com:1883
topic sensors/# out 0
topic commands/# in 0
