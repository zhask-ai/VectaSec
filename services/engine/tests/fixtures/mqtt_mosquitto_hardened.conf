# Golden fixture: a hardened Mosquitto broker.
# Anonymous is explicitly denied, a password_file and acl_file are configured,
# the single listener is TLS on loopback with mutual auth, and the bridge uses
# TLS plus a remote credential.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile

listener 8883 127.0.0.1
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
cafile /etc/mosquitto/certs/ca.crt
require_certificate true

connection secure-bridge
address remote.example.com:8883
remote_username bridgeuser
remote_password s3cr3t-not-stored
bridge_cafile /etc/mosquitto/certs/ca.crt
topic data/# out 0
