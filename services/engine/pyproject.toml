[project]
name = "vectasec-engine"
version = "0.0.1"
description = "VectaSec engine — connectors, detectors, scan runner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2",
  "confluent-kafka>=2.5",
  "httpx>=0.27",              # kong / rabbitmq / mcp connectors (read-only HTTP)
  "redis>=5.0",               # redis connector (read-only INFO / CONFIG GET / ACL)
  "anthropic>=0.116",         # grounded AI triage (optional at runtime — rule fallback if no key)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pyjwt[crypto]>=2.9",       # verify Supabase ES256 JWTs on the engine API (public JWKS)
  "boto3>=1.34",              # aws connector (read-only SQS/SNS/MSK/EventBridge/API GW posture)
  "kubernetes>=29.0",         # k8s connector (read-only CRD posture: Istio/Linkerd/ingress/mesh)
  "grpcio>=1.60",             # rpc connector (gRPC server-reflection posture)
  "grpcio-reflection>=1.60",  # rpc connector (reflection client stubs)
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[project.scripts]
vectasec = "vectasec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectasec"]
