{{/* Chart-managed Secret. Only rendered for values you supply inline.

     A Secret is base64, not encryption: anyone with `get secret` in this namespace reads
     DATABASE_URL, and that DSN is a BYPASSRLS superuser to every tenant's evidence. Inline
     values also persist in the release (`helm get values`) and in your values file. For
     anything real, use database.existingSecret / ai.existingSecret and a proper secret store
     (External Secrets, Vault, SOPS). The inline path exists for evaluation. */}}
{{- $needsDb  := and (not .Values.database.existingSecret) .Values.database.url -}}
{{- $needsAi  := and (not .Values.ai.existingSecret) .Values.ai.anthropicApiKey -}}
{{- if or $needsDb $needsAi }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vectasec.fullname" . }}
  labels:
    {{- include "vectasec.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsDb }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if $needsAi }}
  ANTHROPIC_API_KEY: {{ .Values.ai.anthropicApiKey | quote }}
  {{- end }}
{{- end }}

{{- if and .Values.worker.enabled (not .Values.worker.existingSecret) .Values.worker.enrollToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vectasec.fullname" . }}-worker
  labels:
    {{- include "vectasec.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Mounted as a file, never passed as env: the collector prefers VECTASEC_ENROLL_TOKEN_FILE
  # (config.py) because an env var is visible in /proc and in every crash dump the pod writes.
  VECTASEC_ENROLL_TOKEN: {{ .Values.worker.enrollToken | quote }}
{{- end }}
