{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vectasec.serviceAccountName" . }}
  labels:
    {{- include "vectasec.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No workload here talks to the Kubernetes API, so the token is not mounted. It is the
# difference between a container compromise being a container compromise and being a foothold
# on the API server. No Role or RoleBinding ships with this chart for the same reason.
automountServiceAccountToken: false
{{- end }}
